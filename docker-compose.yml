services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
      POSTGRES_DB: poker
    volumes: ["poker-db:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
  api:
    build: ./backend
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
    environment:
      POKER_DATABASE_URL: postgresql+asyncpg://poker:poker@postgres:5432/poker
      POKER_REDIS_URL: redis://redis:6379/0
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  poker-db:

